<script>
document.getElementById('alert-btn')?.addEventListener('click', () => alert('Hello, world!'));

// Add click handler to logo to return to home screen
document.addEventListener('DOMContentLoaded', function () {
  const homeNavBtn = document.getElementById('home-nav-btn');
  if (homeNavBtn) {
    homeNavBtn.addEventListener('click', function (e) {
      e.preventDefault();
      // Show home screen and reset game state
      showHomeScreen();
      clearInterval(gameInterval);
      updateBestScoreDisplay();
    });
  }
});

/* --- SNAKE GAME LOGIC --- */
const GRID_SIZE = 20;
let CELL_SIZE = 20;
let CANVAS_SIZE = GRID_SIZE * CELL_SIZE;

/**
 * Dynamically set canvas size and cell size based on screen.
 * The canvas will be 90% of the smaller screen dimension.
 */
function updateCanvasSize() {
  // Use 90% of the smaller dimension for a square canvas
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  // Account for some vertical space for navbar and controls
  const availableHeight = vh - 120;
  const size = Math.floor(Math.min(vw, availableHeight) * 0.9);
  CELL_SIZE = Math.max(18, Math.floor(size / GRID_SIZE));
  CANVAS_SIZE = CELL_SIZE * GRID_SIZE;
  const canvas = document.getElementById('snake-canvas');
  if (canvas) {
    canvas.width = CANVAS_SIZE;
    canvas.height = CANVAS_SIZE;
    // Let CSS handle the display size (100% of parent)
    canvas.style.width = "100%";
    canvas.style.height = "100%";
  }
  // Also update the wrapper to be square and fit the canvas
  const wrapper = document.querySelector('.snake-canvas-wrapper');
  if (wrapper) {
    wrapper.style.width = size + "px";
    wrapper.style.height = size + "px";
    wrapper.style.maxWidth = size + "px";
    wrapper.style.maxHeight = size + "px";
  }
}


let snake = [];
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let food = { x: 10, y: 10 };
let score = 0;
let gameInterval = null;
let isGameOver = false;

// Difficulty settings
const DIFFICULTY_SPEED = {
  easy: 110,
  hard: 80
};
let currentDifficulty = 'easy';


function getBestScore() {
  // Try to get from localStorage, fallback to 0
  return Number(localStorage.getItem('bestScore')) || 0;
}

function setBestScore(score, opts = { animate: true }) {
  localStorage.setItem('bestScore', score);
  updateBestScoreDisplay(opts);
}

function confettiBurst() {
  if (window.confetti) {
    confetti({
      particleCount: 80,
      spread: 70,
      origin: { y: 0.25 },
      zIndex: 9999,
      colors: ['#ffc107', '#198754', '#0d6efd', '#f87171', '#fbbf24']
    });
  }
}

function updateBestScoreDisplay({ animate = true } = {}) {
  const bestScoreElem = document.getElementById('best-score');
  if (bestScoreElem) {
    const newScore = getBestScore();
    // Only animate if the score actually changed and animate is true
    if (bestScoreElem.textContent !== String(newScore)) {
      bestScoreElem.textContent = newScore;
      bestScoreElem.classList.remove('animated');
      // Force reflow to restart animation
      void bestScoreElem.offsetWidth;
      if (animate) {
        bestScoreElem.classList.add('animated');
        // Only show confetti if this is not the initial load
        if (typeof updateBestScoreDisplay._hasLoaded === "undefined" || updateBestScoreDisplay._hasLoaded === true) {
          // Use a longer timeout to ensure DOM update before confetti
          setTimeout(() => {
            confettiBurst();
          }, 150);
        }
      }
    } else {
      bestScoreElem.textContent = newScore;
    }
  }
}
updateBestScoreDisplay._hasLoaded = false;

// --- SNAKE GAME UI & LOGIC ---

function showHomeScreen() {
  const homeScreen = document.getElementById('home-screen');
  const gameScreen = document.getElementById('snake-game-screen');
  if (homeScreen && gameScreen) {
    // Prepare for animation: remove class if present
    homeScreen.classList.remove('home-fade-in');
    // Show home screen, hide game screen
    homeScreen.style.display = '';
    gameScreen.style.display = 'none';
    // Trigger reflow to restart animation
    void homeScreen.offsetWidth;
    // Add animation class
    homeScreen.classList.add('home-fade-in');
    // Remove the animation class after animation ends to allow retrigger
    homeScreen.addEventListener('animationend', function handler() {
      homeScreen.classList.remove('home-fade-in');
      homeScreen.removeEventListener('animationend', handler);
    });
  }
  // Show the snake SVG icon if present
  const snakeSvg = document.querySelector('.snake-svg');
  if (snakeSvg) snakeSvg.style.display = '';
  // Show the start button if present
  const startBtn = document.getElementById('start-game-btn');
  if (startBtn) startBtn.style.display = '';
  // Show the difficulty selection
  const difficultySelect = document.querySelector('.difficulty-select');
  if (difficultySelect) difficultySelect.style.display = '';
}

function showGameConsole() {
  document.getElementById('home-screen').style.display = 'none';
  document.getElementById('snake-game-screen').style.display = '';
  // Hide the snake SVG icon if present
  const snakeSvg = document.querySelector('.snake-svg');
  if (snakeSvg) snakeSvg.style.display = 'none';
  // Hide the start button if it somehow remains visible
  const startBtn = document.getElementById('start-game-btn');
  if (startBtn) startBtn.style.display = 'none';
  // Hide the difficulty selection
  const difficultySelect = document.querySelector('.difficulty-select');
  if (difficultySelect) difficultySelect.style.display = 'none';
}

function randomFoodPosition() {
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random() * GRID_SIZE),
      y: Math.floor(Math.random() * GRID_SIZE)
    };
  } while (snake.some(seg => seg.x === pos.x && seg.y === pos.y));
  return pos;
}

function resetGame() {
  snake = [
    { x: 8, y: 10 },
    { x: 7, y: 10 },
    { x: 6, y: 10 }
  ];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  food = randomFoodPosition();
  score = 0;
  isGameOver = false;
  updateScoreDisplay();
}

function updateScoreDisplay() {
  const scoreElem = document.getElementById('current-score');
  if (scoreElem) scoreElem.textContent = `Score: ${score}`;
}

function drawGame(ctx) {
  // Clear
  ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  // Draw food
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(
    food.x * CELL_SIZE + CELL_SIZE / 2,
    food.y * CELL_SIZE + CELL_SIZE / 2,
    CELL_SIZE / 2.5,
    0, 2 * Math.PI
  );
  ctx.fill();

  // Draw snake
  for (let i = 0; i < snake.length; i++) {
    ctx.fillStyle = i === 0 ? '#198754' : '#b9fbc0';
    ctx.fillRect(
      snake[i].x * CELL_SIZE + 2,
      snake[i].y * CELL_SIZE + 2,
      CELL_SIZE - 4,
      CELL_SIZE - 4
    );
  }
}

function moveSnake() {
  // Update direction
  direction = { ...nextDirection };
  const newHead = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  // Check collision with wall
  if (
    newHead.x < 0 ||
    newHead.x >= GRID_SIZE ||
    newHead.y < 0 ||
    newHead.y >= GRID_SIZE
  ) {
    isGameOver = true;
    endGame();
    return;
  }

  // Check collision with self
  if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
    isGameOver = true;
    endGame();
    return;
  }

  snake.unshift(newHead);

  // Eat food
  if (newHead.x === food.x && newHead.y === food.y) {
    score += 1;
    food = randomFoodPosition();
    updateScoreDisplay();
    // Do not update best score here; only update after game ends
  } else {
    snake.pop();
  }
}

function gameLoop() {
  if (isGameOver) return;
  moveSnake();
  const canvas = document.getElementById('snake-canvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    drawGame(ctx);
  }
}

function showCountdown(callback) {
  const overlay = document.getElementById('snake-countdown-overlay');
  const numberSpan = document.getElementById('snake-countdown-number');
  if (!overlay || !numberSpan) {
    callback();
    return;
  }
  overlay.style.display = 'flex';
  let count = 3;
  numberSpan.textContent = count;
  const tick = () => {
    if (count > 1) {
      count -= 1;
      numberSpan.textContent = count;
      setTimeout(tick, 700);
    } else {
      numberSpan.textContent = "Go!";
      setTimeout(() => {
        overlay.style.display = 'none';
        callback();
      }, 600);
    }
  };
  setTimeout(tick, 700);
}
function startGame() {
  updateCanvasSize();
  resetGame();
  showGameConsole();
  const canvas = document.getElementById('snake-canvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    drawGame(ctx);
  }
  if (gameInterval) clearInterval(gameInterval);

  // Hide end card if visible
  const endCard = document.getElementById('snake-end-card');
  if (endCard) endCard.style.display = 'none';

  // Determine selected difficulty
  const easyRadio = document.getElementById('difficulty-easy');
  const hardRadio = document.getElementById('difficulty-hard');
  if (easyRadio && easyRadio.checked) {
    currentDifficulty = 'easy';
  } else if (hardRadio && hardRadio.checked) {
    currentDifficulty = 'hard';
  } else {
    currentDifficulty = 'easy';
  }

  updateDifficultyTicks();

  // Use the DIFFICULTY_SPEED setting for the selected difficulty
  const selectedSpeed = DIFFICULTY_SPEED[currentDifficulty];

  showCountdown(() => {
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, selectedSpeed);
  });
}
function endGame() {
  clearInterval(gameInterval);

  // Update best score only after the game finishes
  let isNewBest = false;
  if (score > getBestScore()) {
    setBestScore(score, { animate: true });
    isNewBest = true;
  } else {
    updateBestScoreDisplay({ animate: false });
  }

  // Show celebratory banner if new best score
  if (isNewBest) {
    // showNewBestBanner();
    confettiBurst();
  }

  // Show end card
  setTimeout(() => {
    const endCard = document.getElementById('snake-end-card');
    const finalScore = document.getElementById('snake-final-score');
    const finalBest = document.getElementById('snake-final-best');
    if (finalScore) finalScore.textContent = score;
    if (finalBest) finalBest.textContent = getBestScore();
    if (endCard) endCard.style.display = 'block';
    // Hide the game board (canvas and score row)
    const canvas = document.getElementById('snake-canvas');
    if (canvas) canvas.getContext('2d').clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  }, 100);
}

// Show and auto-hide the new best score banner
function showNewBestBanner() {
  const banner = document.getElementById('new-best-banner');
  if (banner) {
    banner.style.display = 'flex';
    banner.classList.remove('pop');
    // Force reflow to restart animation
    void banner.offsetWidth;
    banner.classList.add('pop');
    setTimeout(() => {
      banner.style.display = 'none';
      banner.classList.remove('pop');
    }, 2200);
  }
}

// Keyboard controls
document.addEventListener('keydown', function (e) {
  if (document.getElementById('snake-game-console').style.display === 'none') return;
  let handled = false;
  switch (e.key) {
    case 'ArrowUp':
    case 'w':
    case 'W':
      if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
      handled = true;
      break;
    case 'ArrowDown':
    case 's':
    case 'S':
      if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
      handled = true;
      break;
    case 'ArrowLeft':
    case 'a':
    case 'A':
      if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
      handled = true;
      break;
    case 'ArrowRight':
    case 'd':
    case 'D':
      if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
      handled = true;
      break;
  }
  // Prevent scrolling for handled keys
  if (handled) {
    e.preventDefault();
  }
});

// Button event listeners
let playAgainHandler = null;

function updateDifficultyTicks() {
  const easyRadio = document.getElementById('difficulty-easy');
  const hardRadio = document.getElementById('difficulty-hard');
  const tickEasy = document.getElementById('tick-easy');
  const tickHard = document.getElementById('tick-hard');
  if (easyRadio && tickEasy) {
    tickEasy.style.display = easyRadio.checked ? '' : 'none';
  }
  if (hardRadio && tickHard) {
    tickHard.style.display = hardRadio.checked ? '' : 'none';
  }
}

document.addEventListener('DOMContentLoaded', function () {
  updateBestScoreDisplay();
  updateDifficultyTicks();
  const startBtn = document.getElementById('start-game-btn');
  if (startBtn) {
    startBtn.addEventListener('click', startGame);
  }
  const backBtn = document.getElementById('back-to-home-btn');
  if (backBtn) {
    backBtn.addEventListener('click', function () {
      showHomeScreen();
      clearInterval(gameInterval);
      updateBestScoreDisplay();
    });
  }
  // Play again button on end card
  const playAgainBtn = document.getElementById('snake-play-again-btn');
  if (playAgainBtn) {
    if (playAgainHandler) {
      playAgainBtn.removeEventListener('click', playAgainHandler);
    }
    playAgainHandler = function () {
      // Hide end card and restart game
      const endCard = document.getElementById('snake-end-card');
      if (endCard) endCard.style.display = 'none';
      startGame();
    };
    playAgainBtn.addEventListener('click', playAgainHandler);
  }

  // Difficulty radio change: update ticks
  // (Removed: no longer needed since difficulty selection is removed)
});

// Animate the snake body and belly using JS on hover (for all browsers)
(function () {
  document.addEventListener('DOMContentLoaded', function () {
    const snakeSvg = document.querySelector('.snake-svg');
    if (snakeSvg) {
      const body = snakeSvg.querySelector('.snake-body');
      const belly = snakeSvg.querySelector('.snake-belly');
      let animId = null;
      let t0 = null;
      const keyframes = [
        "M20,100 Q60,40 110,80 Q160,120 200,40",
        "M20,100 Q60,60 110,60 Q160,100 200,40",
        "M20,100 Q60,30 110,90 Q160,140 200,40",
        "M20,100 Q60,50 110,70 Q160,110 200,40",
        "M20,100 Q60,40 110,80 Q160,120 200,40"
      ];
      function animateSlither(ts) {
        if (!t0) t0 = ts;
        const t = ((ts - t0) / 1200) % 1;
        const idx = Math.floor(t * (keyframes.length - 1));
        if (body) body.setAttribute('d', keyframes[idx]);
        if (belly) belly.setAttribute('d', keyframes[idx]);
        animId = requestAnimationFrame(animateSlither);
      }
      function start() {
        t0 = null;
        animId = requestAnimationFrame(animateSlither);
      }
      function stop() {
        if (animId) cancelAnimationFrame(animId);
        if (body) body.setAttribute('d', keyframes[0]);
        if (belly) belly.setAttribute('d', keyframes[0]);
      }
      snakeSvg.addEventListener('mouseenter', start);
      snakeSvg.addEventListener('mouseleave', stop);
    }
  });
})();
</script>
